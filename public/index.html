<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Malaysia Social Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◉</span>
      <div>
        <h1>Malaysia Social Pulse</h1>
        <p class="sub">Trending videos, sounds &amp; news, updated live</p>
      </div>
    </div>
    <div class="top-right">
      <span id="live" class="live off"><i></i><span>Connecting…</span></span>
      <span id="clock" class="clock" title="Malaysia time (MYT)"></span>
      <button id="refreshAll" class="btn">↻ Refresh all</button>
      <button id="themeToggle" class="btn icon" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <section id="status" class="status-strip" aria-label="Data sources"></section>

  <main class="layout">
    <section class="col-main">
      <div class="panel">
        <div class="panel-head">
          <h2>Trending videos <span class="muted" id="videoCount"></span></h2>
          <div class="controls">
            <div class="seg" id="platformFilter" role="tablist">
              <button data-v="all" class="on">All</button>
              <button data-v="tiktok">TikTok</button>
              <button data-v="instagram">Instagram</button>
              <button data-v="facebook">Facebook</button>
              <button data-v="youtube">YouTube</button>
            </div>
            <select id="sortBy" aria-label="Sort videos">
              <option value="score">🔥 Trending now</option>
              <option value="views">Most views</option>
              <option value="likes">Most likes</option>
              <option value="newest">Newest</option>
            </select>
          </div>
        </div>
        <div id="videos" class="video-grid"></div>
      </div>
    </section>

    <aside class="col-side">
      <div class="panel">
        <div class="panel-head">
          <h2>Sounds &amp; music</h2>
          <div class="seg small" id="soundFilter">
            <button data-v="all" class="on">All</button>
            <button data-v="music">Music</button>
            <button data-v="original">Original / SFX</button>
          </div>
        </div>
        <div id="sounds" class="sound-list"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Trending hashtags</h2></div>
        <div id="hashtags"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Trending searches <span class="muted">· Google, Malaysia</span></h2></div>
        <ol id="searchTrends" class="search-list"></ol>
      </div>

      <div class="panel news-panel">
        <div class="panel-head">
          <h2>Latest Malaysia news</h2>
          <div class="seg small" id="langFilter">
            <button data-v="all" class="on">All</button>
            <button data-v="en">EN</button>
            <button data-v="ms">BM</button>
          </div>
        </div>
        <ul id="news" class="news-list"></ul>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="player" preload="none"></audio>
  <script src="app.js" type="module"></script>
</body>
</html>
